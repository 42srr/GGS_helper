services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ggs_postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: Asia/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ggs_network
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=64MB"
      - "-c"
      - "work_mem=2MB"
      - "-c"
      - "maintenance_work_mem=32MB"
      - "-c"
      - "effective_cache_size=256MB"
      - "-c"
      - "max_connections=30"

  # NestJS Backend
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ggs_backend
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      ADMIN_ID: ${ADMIN_ID:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      NODE_OPTIONS: "--max-old-space-size=256"
      TZ: Asia/Seoul
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      - backend_uploads:/app/uploads
      - backend_backups:/app/backups
    networks:
      - ggs_network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 300m
    memswap_limit: 512m

  # React Frontend (Nginx)
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: ggs_frontend
    environment:
      TZ: Asia/Seoul
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - ggs_network
    depends_on:
      - backend
    restart: unless-stopped
    mem_limit: 64m

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local
  backend_backups:
    driver: local

networks:
  ggs_network:
    driver: bridge
